name: PostgreSQL storage integration
on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/postgres-storage.mjs'
      - 'package.json'
      - '.github/workflows/postgres-storage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: firewell_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d firewell_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: PostgreSQL persistence & compatibility smoke
        env:
          FIREWELL_TEST_POSTGRES_URL: postgresql://test:test@localhost:5432/firewell_test
        run: npm run test:postgres
