name: Firewell Alpha CI
on:
  push:
    branches: [main, 'codex/pvp-mobile-ui-bugfixes']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede only obsolete CI on the exact same ref.
concurrency:
  group: firewell-alpha-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Server tests and card catalog check
        run: npm test
      - name: Client syntax
        run: |
          node --check web/app.js
          node --check web/i18n.js
          node --check web/rules.js
          node --check web/ui/api.js
          node --check web/ui/cards.js
          node --check web/ui/chat.js
  browser:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Chromium and OS libraries are preinstalled and pinned to Playwright.
    # Avoid repeated downloads and --with-deps apt installs on each job.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install matching Playwright JS client
        run: npm install --no-save --no-audit --no-fund playwright@1.57.0
      - name: Prepare card catalog
        run: npm run cards:sync
      - name: Browser end-to-end smoke
        timeout-minutes: 5
        run: node --experimental-strip-types test/browser-e2e.mjs
      - name: Six starter decks against the server bot
        timeout-minutes: 5
        run: node --experimental-strip-types test/browser-bot-release.mjs
      - name: Responsive dialog and profile flows
        timeout-minutes: 5
        run: node --experimental-strip-types test/browser-dialogs.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firewell-browser-screenshots
          path: artifacts/browser/
          if-no-files-found: ignore
