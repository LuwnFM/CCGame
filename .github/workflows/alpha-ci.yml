name: Firewell Alpha CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tests
        run: npm test
      - name: Client syntax
        run: node --check web/app.js
      - name: Install browser test runner
        run: npm install --no-save playwright@1.57.0
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end smoke
        run: node --experimental-strip-types test/browser-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firewell-browser-screenshots
          path: artifacts/browser/
          if-no-files-found: ignore
