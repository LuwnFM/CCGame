name: Firewell Alpha CI
on:
  push:
    branches: [main, codex/initial-rules-core]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tests
        run: npm test
      - name: Client syntax
        run: node --check web/app.js
