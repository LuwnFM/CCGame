name: Firewell Balance Simulation
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 2592 seeded balance matches (3 scenarios)
        run: npm run test:balance
